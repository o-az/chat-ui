name: 'Lint/Test/Build'

on:
  push:
    branches: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: true
  ACTIONS_RUNNER_DEBUG: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 'Setup Bun'
        uses: oven-sh/setup-bun
        with:
          bun-version: 'latest'

      - name: 'Install Dependencies'
        run: |
          bun install

      - name: 'Lint & Format'
        run: |
          bun lint
          bun format

      - name: 'Typecheck'
        run: bun typecheck

      - name: 'Test'
        run: bun test

      - name: 'Build'
        run: bun build
